name: backend
on:
  push:
    paths:
      - 'crmfinance-scaffold/crmfinance-scaffold/backend/**'
  pull_request:
    paths:
      - 'crmfinance-scaffold/crmfinance-scaffold/backend/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crmfinance-scaffold/crmfinance-scaffold/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
